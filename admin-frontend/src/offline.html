<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Offline — Avnideep Admin</title>
<link rel="stylesheet" href="/css/styles.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#f59e0b">
<style>
  .offline-page {
    min-height: 100vh; min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; text-align: center;
  }
  .offline-card {
    max-width: 360px; width: 100%;
  }
  .offline-icon {
    width: 80px; height: 80px; border-radius: 50%;
    background: rgba(245,158,11,.12); border: 2px solid rgba(245,158,11,.3);
    display: flex; align-items: center; justify-content: center;
    font-size: 36px; margin: 0 auto 20px;
  }
  .offline-card h1 { font-size: 22px; color: var(--primary); margin-bottom: 8px; }
  .offline-card p { font-size: 14px; color: var(--text2); line-height: 1.6; margin-bottom: 24px; }
  .offline-card .cached-info {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px; font-size: 12px; color: var(--text2);
    margin-bottom: 20px;
  }
  .offline-card .cached-info strong { color: var(--primary); }
  .retry-btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 28px; border-radius: 10px;
    background: var(--primary); color: #000; font-size: 15px; font-weight: 700;
    border: none; cursor: pointer; font-family: inherit;
    min-height: 44px;
  }
  .retry-btn:hover { background: var(--primary-hover); }
  @media (max-width: 480px) {
    .offline-page { padding: 16px; }
    .offline-card h1 { font-size: 20px; }
    .offline-icon { width: 64px; height: 64px; font-size: 28px; }
  }
</style>
</head>
<body>
<div class="offline-page">
  <div class="offline-card">
    <div class="offline-icon">📡</div>
    <h1>You're Offline</h1>
    <p>No internet connection detected.<br>Some features may be unavailable until you reconnect.</p>
    <div class="cached-info">
      📦 <strong>Cached pages</strong> like Dashboard, Orders, and Analytics are still accessible.
    </div>
    <button class="retry-btn" onclick="retryConnection()">🔄 Try Again</button>
  </div>
</div>
<script>
function retryConnection() {
  if (navigator.onLine) {
    window.location.reload();
  } else {
    const btn = document.querySelector('.retry-btn');
    btn.textContent = '⏳ Still offline...';
    btn.disabled = true;
    setTimeout(function() {
      btn.textContent = '🔄 Try Again';
      btn.disabled = false;
      if (navigator.onLine) window.location.reload();
    }, 3000);
  }
}
// Auto-retry when back online
window.addEventListener('online', function() { window.location.reload(); });
</script>
</body>
</html>
